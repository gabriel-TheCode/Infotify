apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'
apply from: '../ktlint.gradle'
apply plugin: 'com.mikepenz.aboutlibraries.plugin'

// The NewsData.io key is read from local.properties, which is gitignored.
// It is never hardcoded here. CI writes the value from a repository secret.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def newsDataApiKey = localProperties.getProperty('NEWSDATA_API_KEY')
        ?: System.getenv('NEWSDATA_API_KEY')
        ?: ''

android {
    namespace "com.thecode.infotify"
    compileSdk 35
    defaultConfig {
        applicationId "com.thecode.infotify"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1100
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "NEWSDATA_API_KEY", "\"${newsDataApiKey}\"")
    }
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        // java.time is used across the domain layer; desugaring backports it below API 26.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions { jvmTarget = "11" }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Room schemas are exported so migrations can be diffed and tested.
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    // COMPOSE — single source of UI. No View system, no ViewBinding, no ComposeView bridges.
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // SPLASH SCREEN API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // COIL — Compose-native image loading, replaces Glide
    implementation 'io.coil-kt:coil-compose:2.7.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // KOTLIN
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.20"
    implementation 'androidx.core:core-ktx:1.15.0'

    // COROUTINES
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // DI - HILT
    implementation "com.google.dagger:hilt-android:2.52"
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    kapt "com.google.dagger:hilt-android-compiler:2.52"
    kapt "androidx.hilt:hilt-compiler:1.2.0"

    //DATA STORE
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // UI
    // Removed with the Compose migration: AestheticDialogs, DayNightSwitch,
    // recyclerview-animators, themed-toggle-button-group, bubblenavigation.aar.
    implementation 'com.airbnb.android:lottie-compose:6.4.1'
    implementation 'com.mikepenz:aboutlibraries-compose-m3:11.2.3'

    // GSON
    implementation "com.google.code.gson:gson:2.10.1"

    // RETROFIT
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    // OK HTTP — pinned to the 4.x stable line; 5.0.0-alpha.2 was a pre-release
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // ROOM
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // CUSTOM TABS — replaces the in-dialog WebView for article reading
    implementation 'androidx.browser:browser:1.8.0'

    // PAGING — cursor pagination over NewsData.io nextPage tokens
    implementation 'androidx.paging:paging-runtime-ktx:3.3.5'
    implementation 'androidx.paging:paging-compose:3.3.5'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'app.cash.turbine:turbine:1.2.0'
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
